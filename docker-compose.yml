services:
  db:
    image: postgres:17-alpine
    container_name: waste_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waste_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - waste-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waste_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  sonarqube:
    image: sonarqube:community
    container_name: waste_tracker_sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=postgres
      - SONAR_JDBC_PASSWORD=postgres
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/waste_tracker
      - SONAR_INITIAL_ADMIN_PASSWORD=S&nh@!123456
      - SONAR_UPDATE_FIRST_LOGIN=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - waste-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waste_tracker_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/waste_tracker
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - waste-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waste_tracker_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - waste-network

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  waste-network:
    driver: bridge