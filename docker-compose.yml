version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: waste_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waste_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - waste-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waste_tracker_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/waste_tracker
    depends_on:
      - db
    networks:
      - waste-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waste_tracker_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - waste-network

volumes:
  postgres_data:

networks:
  waste-network:
    driver: bridge